name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # The gate for what the visitor sees. Runs against the production server across
  # parallel shards so adding landing sites does not push a single serial job past
  # the runner timeout. Every check must exit 0 and leave a numeric report with no
  # failures: writing screenshots is not evidence on its own.
  visual-gate:
    name: visual-gate (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: test-and-build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: integration-desktop-compact
            only: integration
            viewports: desktop,compact
          - name: integration-phone-short
            only: integration
            viewports: phone,short
          - name: sky-moments
            only: sky-bodies,moments-sunspots
            viewports: ""
          - name: saturn-shadows
            only: saturn-shadows
            viewports: ""
          - name: controls-desktop-tablet
            only: controls
            viewports: desktop,tablet
          - name: controls-phone-short
            only: controls
            viewports: phone,short
          - name: landings-desktop
            only: landings
            viewports: desktop
          - name: landings-phone
            only: landings
            viewports: phone
          - name: landings-tablet
            only: landings
            viewports: tablet
          - name: landings-short
            only: landings
            viewports: short
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The checks launch Edge on the machines they were written on; a runner has no Edge, and the
      # version a runner happens to ship would move the pixel counts, so the gate drives Playwright's
      # own Chromium, whose build is pinned by the playwright package.
      - name: Install the browser the gate drives
        run: npx playwright install --with-deps chromium
      - name: Visual acceptance (${{ matrix.shard.name }})
        run: npm run test:visual -- --only=${{ matrix.shard.only }}
        env:
          ATLAS_BROWSER_CHANNEL: chromium
          ATLAS_VIEWPORTS: ${{ matrix.shard.viewports }}
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-evidence-${{ matrix.shard.name }}
          path: test-results/
          retention-days: 14
