name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # The gate for what the visitor sees. It runs the browser checks the project already had as one
  # command against the production server, and each of them has to leave a numeric report with no
  # failures: writing screenshots is not evidence on its own.
  visual-gate:
    runs-on: ubuntu-latest
    needs: test-and-build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The checks launch Edge on the machines they were written on; a runner has no Edge, and the
      # version a runner happens to ship would move the pixel counts, so the gate drives Playwright's
      # own Chromium, whose build is pinned by the playwright package.
      - name: Install the browser the gate drives
        run: npx playwright install --with-deps chromium
      - name: Visual acceptance
        run: npm run test:visual
        env:
          ATLAS_BROWSER_CHANNEL: chromium
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: test-results/
          retention-days: 14
